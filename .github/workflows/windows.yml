name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure x64 Release
        run: cmake -S . -B build/release -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build/release --config Release --parallel

      - name: Run self-test
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./scripts/ci-smoke.ps1 -Exe ./build/release/bin/Release/Peek.exe

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item build/release/bin/Release/Peek.exe artifact/Peek.exe
          $hash = (Get-FileHash artifact/Peek.exe -Algorithm SHA256).Hash
          "$hash  Peek.exe" | Set-Content artifact/SHA256SUMS.txt -Encoding ascii

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Peek-windows-x64
          path: artifact/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Download verified build
        uses: actions/download-artifact@v4
        with:
          name: Peek-windows-x64
          path: artifact

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "${{ github.ref_name }}" artifact/Peek.exe artifact/SHA256SUMS.txt --clobber
          } else {
            gh release create "${{ github.ref_name }}" artifact/Peek.exe artifact/SHA256SUMS.txt --generate-notes --title "${{ github.ref_name }}"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
